name: Daily health data refresh

on:
  schedule:
    # Runs 4x a day by default so same-day news/triggers get caught
    # sooner instead of waiting a full 24h — 00:00, 06:00, 12:00, 18:00
    # UTC (~8AM, 2PM, 8PM, 2AM Philippine time). The scraper is
    # dedup-safe (see refresh_health_data.py), so running it more often
    # never creates duplicates — it just means less time between "DOH
    # publishes something" and "the report shows it."
    # Drop to once a day by deleting 3 of these 4 lines if you'd rather
    # keep Actions usage minimal. https://crontab.guru helps with cron syntax.
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python refresh_health_data.py

      - name: Commit updated data
        run: |
          git config user.name "health-data-bot"
          git config user.email "actions@github.com"
          git add health_data.json
          git diff --quiet --cached || git commit -m "Health data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
